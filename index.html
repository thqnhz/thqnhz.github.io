<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>thqnhz.github.io</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@300..700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="vscode">
        <div class="activity-bar">
            <div class="left-side">
                <div><img src="https://github.com/thqnhz.png" alt="avatar" id="avatar"/></div>
                <div class="util-link">File</div>
                <div class="util-link">Edit</div>
                <div class="util-link">Selection</div>
                <div class="util-link">View</div>
                <div class="util-link" style="font-family: sans-serif;">&hellip;</div>
            </div>
            <div class="middle-side">
                <input type="text" class="command-pallete" placeholder="&#x1F50D;&#xFE0E; Search - Visual Studio Code"/>
            </div>
            <div class="right-side">
                <div class="windows-button green"></div>
                <div class="windows-button yellow"></div>
                <div class="windows-button red"></div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
