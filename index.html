<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>thqnhz.github.io</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@300..700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div id="fullscreen-overlay">
        <div class="prompt-box">
            <h2>Enter Fullscreen</h2>
            <p>This website is designed for fullscreen mode.<br/>Click below to enter fullscreen or press F11.</p>
            <button id="fullscreen-btn">Fullscreen</button>
        </div>
    </div>
    <div id="desktop" class="hidden">
        <img src="asset/wallpaper.png"/>
    </div>

    <div id="vscode">
        <div class="activity-bar">
            <div class="left-side">
                <div><img src="https://github.com/thqnhz.png" alt="avatar" id="avatar"/></div>
                <div class="util-link">File</div>
                <div class="util-link">Edit</div>
                <div class="util-link">Selection</div>
                <div class="util-link">View</div>
                <div class="util-link" style="font-family: sans-serif;">&hellip;</div>
            </div>
            <div class="middle-side">
                <div class="util-link previous">&lt;-</div>
                <div class="util-link next">-&gt;</div>
                <input type="text" class="command-palette" placeholder="&#x1F50D;&#xFE0E; Search - Visual Studio Code"/>
            </div>
            <div class="right-side">
                <div class="windows-button green" title="Minimize"></div>
                <div class="windows-button yellow" title="Maximize"></div>
                <div class="windows-button red" title="Close"></div>
            </div>
        </div>

        <div class="editor">
            <div class="left-side">
                <div class="tabs">
                    <img src="asset/explorer.png" alt="tab-explorer" class="active"/>
                </div>
                <div class="explorer">
                    <div class="explorer-title">EXPLORER</div>
                    <ul class="file">
                        <li class="active">index.html</li>
                        <li>style.css</li>
                        <li>script.js</li>
                    </ul>
                </div>
            </div>

            <div class="right-side">
                <div class="code-editor">

                </div>
                <div class="terminal">
                    <div class="terminal-bar">
                        <div class="left-side">
                            <div class="label active">PROBLEMS</div>
                            <div class="label">OUTPUT</div>
                            <div class="label">TERMINAL</div>
                            <div class="label">PORTS</div>
                        </div>
                        <div class="middle-side">

                        </div>
                        <div class="right-side">

                        </div>
                    </div>
                    <div class="display">

                    </div>
                </div>
            </div>
        </div>

        <div class="status-bar">
            <div class="left-side">
                <div class="source-control">
                    <img src="asset/source-control.png" alt="source-control">
                    <span>dev!*</span>
                </div>
            </div>
            <div class="right-side">
                <img src="asset/notification.png" alt="notification">
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
