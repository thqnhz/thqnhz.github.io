<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>thqnhz.github.io</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@300..700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div id="fullscreen-overlay">
        <div id="prompt-box">
            <h2>Enter Fullscreen</h2>
            <p>This website is designed for fullscreen mode.<br/>Click below to enter fullscreen or press F11.</p>
            <button id="fullscreen-btn">Fullscreen</button>
        </div>
    </div>

    <div id="desktop" class="hidden">
        <img src="asset/desktop/wallpaper.png"/>
        <div id="taskbar">
            <div class="left-side">
                <div class="app"><img src="asset/desktop/windows-logo.svg"></div>
                <div class="app"><img src="asset/desktop/vscode-logo.svg" alt="Visual Studio Code" id="vscode-icon"></div>
                <div class="app"><img src="asset/desktop/wordle-icon.png" alt="Wordle" id="wordle-icon"></div>
                <div class="app"><a href="https://github.com/thqnhz/" target="_blank" rel="noopener noreferrer"><img src="asset/desktop/github-logo.svg" alt="GitHub"></a></div>
                <div class="app"><a href="https://music.youtube.com" target="_blank" rel="noopener noreferrer"><img src="asset/desktop/ytm-logo.svg" alt="YouTube Music"></a></div>
            </div>
            <div class="right-side">
                <div id="date">
                    <span id="hour">12:34</span>
                    <br/>
                    <span id="day">1/2/2025</span>
                </div>
            </div>
        </div>
    </div>

    <div id="vscode">
        <div id="activity-bar">
            <div class="left-side">
                <div><img src="https://github.com/thqnhz.png" alt="avatar" id="avatar"/></div>
                <div class="util-link">File</div>
                <div class="util-link">Edit</div>
                <div class="util-link">Selection</div>
                <div class="util-link">View</div>
                <div class="util-link" style="font-family: sans-serif;">&hellip;</div>
            </div>
            <div class="middle-side">
                <div class="util-link previous">&lt;-</div>
                <div class="util-link next">-&gt;</div>
                <input type="text" id="command-palette" placeholder="&#x1F50D;&#xFE0E; Search - Visual Studio Code"/>
            </div>
            <div class="right-side">
                <div class="windows-button green" title="Minimize"></div>
                <div class="windows-button yellow" title="Maximize"></div>
                <div class="windows-button red" title="Close"></div>
            </div>
        </div>

        <div id="editor">
            <div class="left-side">
                <div id="tabs">
                    <img src="asset/vscode/explorer.png" alt="tab-explorer" class="active"/>
                </div>
                <div id="explorer">
                    <div class="explorer-title">EXPLORER</div>
                    <ul class="file">
                        <li class="active">index.html</li>
                        <li>style.css</li>
                        <li>script.js</li>
                    </ul>
                </div>
            </div>

            <div class="right-side">
                <div id="code-editor">

                </div>
                <div id="terminal">
                    <div id="terminal-bar">
                        <div class="left-side">
                            <div class="label active">PROBLEMS</div>
                            <div class="label">OUTPUT</div>
                            <div class="label">TERMINAL</div>
                            <div class="label">PORTS</div>
                        </div>
                        <div class="middle-side">

                        </div>
                        <div class="right-side">

                        </div>
                    </div>
                    <div class="display">

                    </div>
                </div>
            </div>
        </div>

        <div id="status-bar">
            <div class="left-side">
                <div class="source-control">
                    <img src="asset/vscode/source-control.png" alt="source-control">
                    <span>dev!*</span>
                </div>
            </div>
            <div class="right-side">
                <img src="asset/vscode/notification.png" alt="notification">
            </div>
        </div>
    </div>

    <div id="wordle-window" class="hidden">
        <div class="window-header">
            <span class="window-title">Wordle</span>
            <div class="window-controls">
                <div class="windows-button red" id="close-wordle"></div>
            </div>
        </div>
        <div class="window-controls-bar">
            <select id="word-length-select">
                <option value="3">3 Letters</option>
                <option value="4">4 Letters</option>
                <option value="5" selected>5 Letters</option>
                <option value="6">6 Letters</option>
                <option value="7">7 Letters</option>
                <option value="8">8 Letters</option>
            </select>
            <button id="new-game-btn">New Game</button>
        </div>
        <div class="game-container">
            <div id="wordle-grid"></div>
            <div id="wordle-keyboard">
                <div class="keyboard-row">
                    <button class="key" data-key="Q">Q</button>
                    <button class="key" data-key="W">W</button>
                    <button class="key" data-key="E">E</button>
                    <button class="key" data-key="R">R</button>
                    <button class="key" data-key="T">T</button>
                    <button class="key" data-key="Y">Y</button>
                    <button class="key" data-key="U">U</button>
                    <button class="key" data-key="I">I</button>
                    <button class="key" data-key="O">O</button>
                    <button class="key" data-key="P">P</button>
                </div>
                <div class="keyboard-row">
                    <button class="key" data-key="A">A</button>
                    <button class="key" data-key="S">S</button>
                    <button class="key" data-key="D">D</button>
                    <button class="key" data-key="F">F</button>
                    <button class="key" data-key="G">G</button>
                    <button class="key" data-key="H">H</button>
                    <button class="key" data-key="J">J</button>
                    <button class="key" data-key="K">K</button>
                    <button class="key" data-key="L">L</button>
                </div>
                <div class="keyboard-row">
                    <button class="key wide" data-key="ENTER">ENTER</button>
                    <button class="key" data-key="Z">Z</button>
                    <button class="key" data-key="X">X</button>
                    <button class="key" data-key="C">C</button>
                    <button class="key" data-key="V">V</button>
                    <button class="key" data-key="B">B</button>
                    <button class="key" data-key="N">N</button>
                    <button class="key" data-key="M">M</button>
                    <button class="key wide" data-key="BACKSPACE">&#9003;</button>
                </div>
            </div>
        </div>
        <div id="wordle-toast-container"></div>
    </div>

    <script src="script.js"></script>
    <script src="wordle.js"></script>
</body>

</html>
